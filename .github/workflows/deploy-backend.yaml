name: Deploy Backend (WAD Capstone)

on:
  push:
    branches:
      - main
    paths:
      - '**/*.js'
      - 'package*.json'
      - 'prisma/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate and Fetch Secrets from Bitwarden
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            0e461e0b-4d3a-4637-ad40-b47b0066d257 > DATABASE_URL
            b06513d8-04f8-4e1c-b8ae-b47b0066ec65 > JWT_ACCESS_SECRET
            8682cd77-9382-44b7-a51a-b47b0067268f > JWT_REFRESH_SECRET
            42544ef3-0a3b-4c41-8dc1-b47b0067ad57 > ALLOWED_ORIGINS

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set Short Git Commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            wad-backend:latest
            wad-backend:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Archive Docker Image
        run: docker save wad-backend:latest -o wad-backend-latest.tar

      - name: Copy Files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,wad-backend-latest.tar"
          target: "/app/wad-project"

      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DATABASE_URL,JWT_ACCESS_SECRET,JWT_REFRESH_SECRET,ALLOWED_ORIGINS
          script: |
            cd /app/wad-project
            
            docker load -i wad-backend-latest.tar
            rm -f wad-backend-latest.tar
            
            export DATABASE_URL="${DATABASE_URL}"
            export JWT_ACCESS_SECRET="${JWT_ACCESS_SECRET}"
            export JWT_REFRESH_SECRET="${JWT_REFRESH_SECRET}"
            export ALLOWED_ORIGINS="${ALLOWED_ORIGINS}"
            export PORT=3000
            export NODE_ENV=production
            export APP_NAME="WAD Capstone API"
            export APP_VERSION="1.0.0"
            
            docker compose down --remove-orphans
            docker compose up -d

            docker image prune -f